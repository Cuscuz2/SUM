<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUM · Mapa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/lucide@0.263.0"></script>

<!-- Leaflet (mapa real, gratuito, sin API key) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mapa.css">
</head>
<body class="dash-body">

<div class="dash-shell">

    <!-- ====== BARRA LATERAL ====== -->
    <aside class="dash-sidebar">
        <div class="dash-sidebar-top">
            <div class="dash-logo">
                <span class="dash-logo-icon"><i data-lucide="alert-circle"></i></span>
                <span class="dash-logo-text">SUM</span>
            </div>

            <div class="dash-profile">
                <img src="https://i.pravatar.cc/80?img=13" alt="" class="dash-avatar">
                <div class="dash-profile-info">
                    <p class="dash-profile-name">Bienvenido de nuevo</p>
                    <p class="dash-profile-role">Viajero Frecuente</p>
                </div>
            </div>

            <button class="dash-recharge-btn">
                <i data-lucide="credit-card" class="icon-sm"></i>
                Recargar Cívica
            </button>

            <nav class="dash-nav">
                <a href="#" class="dash-nav-item active">
                    <i data-lucide="layout-grid"></i>
                    <span>Panel</span>
                </a>
                <a href="#" class="dash-nav-item">
                    <i data-lucide="map"></i>
                    <span>Mapa en Vivo</span>
                </a>
            </nav>
        </div>

        <div class="dash-sidebar-bottom">
            <a href="index.html" class="dash-nav-item dash-nav-item-muted">
                <i data-lucide="log-out"></i>
                <span>Cerrar Sesión</span>
            </a>
        </div>
    </aside>

    <!-- ====== MAPA ====== -->
    <section class="dash-map" id="mapArea">
        <div id="leafletMap" class="dash-map-canvas"></div>

        <!-- Controles del mapa -->
        <div class="map-controls">
            <button class="map-ctrl-btn" id="btnLocate" aria-label="Mi ubicación" title="Mi ubicación">
                <i data-lucide="locate-fixed"></i>
            </button>
            <div class="map-zoom-group">
                <button class="map-ctrl-btn" id="btnZoomIn" aria-label="Acercar" title="Acercar">
                    <i data-lucide="plus"></i>
                </button>
                <button class="map-ctrl-btn" id="btnZoomOut" aria-label="Alejar" title="Alejar">
                    <i data-lucide="minus"></i>
                </button>
            </div>
            <button class="map-ctrl-btn" id="btnLayers" aria-label="Cambiar capa de mapa" title="Cambiar capa de mapa">
                <i data-lucide="layers"></i>
            </button>
        </div>

        <!-- Leyenda de líneas (clic para mostrar/ocultar cada línea) -->
        <div class="map-legend">
            <button class="legend-pill" data-line="a" type="button">
                <span class="legend-dot" style="background:#2563eb;"></span>
                Línea A
                <i data-lucide="check-circle-2" class="legend-status legend-status--ok"></i>
            </button>
            <button class="legend-pill" data-line="b" type="button">
                <span class="legend-dot" style="background:#f5a623;"></span>
                Línea B
                <i data-lucide="check-circle-2" class="legend-status legend-status--ok"></i>
            </button>
            <button class="legend-pill" data-line="tranvia" type="button">
                <span class="legend-dot" style="background:#7c3aed;"></span>
                Tranvía
                <i data-lucide="alert-triangle" class="legend-status legend-status--warn"></i>
            </button>
        </div>
    </section>

    <!-- ====== PANEL DE RUTA ====== -->
    <aside class="dash-panel">
        <h1 class="panel-title">Planea tu Ruta</h1>

        <div class="route-card">
            <div class="route-field">
                <span class="route-dot route-dot--origin"></span>
                <div class="route-input-wrap">
                    <label for="origen">Origen</label>
                    <div class="route-input">
                        <input type="text" id="origen" value="San Antonio" autocomplete="off">
                        <i data-lucide="search" class="icon-sm"></i>
                    </div>
                </div>
            </div>

            <span class="route-line" aria-hidden="true"></span>

            <div class="route-field">
                <span class="route-pin route-pin--dest"><i data-lucide="map-pin"></i></span>
                <div class="route-input-wrap">
                    <label for="destino">Destino</label>
                    <div class="route-input">
                        <input type="text" id="destino" value="Poblado" autocomplete="off">
                        <i data-lucide="search" class="icon-sm"></i>
                    </div>
                </div>
            </div>

            <button class="route-swap" id="btnSwap" aria-label="Intercambiar origen y destino" title="Intercambiar">
                <i data-lucide="arrow-up-down"></i>
            </button>
        </div>

        <h2 class="panel-subtitle">Resumen de Ruta</h2>

        <div class="summary-grid">
            <div class="summary-card">
                <p class="summary-label"><i data-lucide="clock" class="icon-sm"></i> Tiempo aproximado</p>
                <p class="summary-value"><span id="summaryTime">—</span> <span class="summary-unit">min</span></p>
                <div class="summary-progress"><span id="summaryBar" style="width:0%;"></span></div>
            </div>

            <div class="summary-card summary-card--accent">
                <p class="summary-label"><i data-lucide="landmark" class="icon-sm"></i> Costo total</p>
                <p class="summary-value">$<span id="summaryCost">3.210</span></p>
                <p class="summary-unit">COP</p>
                <span class="summary-tag"><i data-lucide="info" class="icon-sm"></i> Tarifa Frecuente</span>
            </div>
        </div>

        <button class="btn-navigate" id="btnNavigate">
            <i data-lucide="navigation"></i>
            Iniciar Navegación
        </button>

        <a href="#" class="panel-schedule-link">Ver horario detallado</a>
    </aside>

</div>

<div class="toast" id="toast"></div>

<script src="mapa.js"></script>
</body>
</html>
